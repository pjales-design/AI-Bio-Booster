<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF6FA; --surface: #FFFFFF; --ink: #2F3033; --ink-soft: #4B5563; --ink-muted: #6B7280;
    --accent: #009FD9; --accent-deep: #007FAD; --accent-bg: #EAF6FA; --highlight: #FFDD80;
    --rule: #E5E7EB; --shadow-sm: rgba(0,0,0,0.05); --shadow-md: rgba(0,31,51,0.10);
    --plus: #16855B; --plus-light: #E1FDF3;
    --premium: #4F54B2; --premium-light: #E8F1FD;
    --warn: #B45F06;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 100vw; min-height: 100vh; margin: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', system-ui, sans-serif; padding: 40px 16px;
  }
  .wrap { width: 660px; max-width: 94vw; }
  .intro { font-size: 15px; color: var(--ink-soft); margin: 0 0 16px; line-height: 1.5; text-align: center; }
  .pro-tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .pro-tab {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; color: var(--ink-muted);
    background: transparent; border: 1px solid var(--rule); border-radius: 20px; padding: 6px 13px; cursor: pointer;
  }
  .pro-tab.active { color: var(--accent-deep); border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }
  .book { perspective: 1800px; position: relative; }
  .page {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    padding: 30px 34px; box-shadow: 0 1px 2px var(--shadow-sm), 0 8px 24px var(--shadow-md);
    min-height: 380px; transform-origin: left center; backface-visibility: hidden;
  }
  .conclusion-overlay {
    position: absolute; inset: 0; z-index: 5; border-radius: 10px;
    background: rgba(47,48,51,0.5); display: flex; align-items: center; justify-content: center;
    padding: 20px; animation: fadeIn .25s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .conclusion-card {
    background: var(--surface); border-radius: 10px; padding: 34px 32px; max-width: 380px; width: 100%;
    text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  .conclusion-icon { width: 48px; height: 48px; color: var(--accent); margin: 0 auto 14px; display: block; }
  .conclusion-headline { font-size: 20px; font-weight: 700; color: var(--ink); margin: 0 0 8px; }
  .conclusion-body { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 20px; }
  .conclusion-callout {
    display: flex; align-items: center; gap: 10px; background: var(--accent-bg, #EAF6FA); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 16px; text-align: left;
  }
  .conclusion-callout-arrow { font-size: 20px; color: var(--accent-deep); flex: 0 0 auto; }
  .conclusion-callout-text { font-size: 12.5px; line-height: 1.5; color: var(--accent-deep); font-weight: 500; }
  .conclusion-back {
    font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 500; color: var(--ink-muted);
    background: transparent; border: none; cursor: pointer; text-decoration: underline;
  }
  .page-eyebrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .page-eyebrow-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-deep); }
  .page-eyebrow-count { font-size: 11px; color: var(--ink-muted); }
  .pro-header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .doodle-box { flex: 0 0 52px; width: 52px; height: 56px; color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .doodle-box svg { width: 100%; height: 100%; overflow: visible; }
  .pro-header-text { flex: 1; min-width: 0; }
  .pro-name { font-size: 18px; font-weight: 700; color: var(--ink); margin: 0 0 2px; letter-spacing: -0.01em; }
  .pro-trade { font-size: 12.5px; font-weight: 400; color: var(--ink-muted); margin: 0; }
  .ready-badge { flex: 0 0 auto; font-size: 11px; font-weight: 600; color: var(--accent-deep); background: var(--accent-bg); padding: 5px 10px; border-radius: 20px; white-space: nowrap; }
  .slots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 22px; }
  .slot { min-width: 0; }
  .slot-label { font-size: 10px; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 4px; }
  .slot-num { display: inline-block; color: var(--accent-deep); margin-right: 5px; font-weight: 700; }
  .slot-evidence { font-size: 12.5px; line-height: 1.5; color: var(--ink); margin: 0; }
  .hl { background: var(--highlight); padding: 1px 3px; border-radius: 2px; }
  .story-p { font-size: 14.5px; line-height: 1.6; color: var(--ink); margin: 0 0 12px; }
  .story-p.quote { font-style: italic; }
  .quote-inline { font-style: italic; }
  .story-step { font-size: 14px; line-height: 1.7; color: var(--ink); margin: 0 0 8px; }
  .pkg { font-weight: 700; padding: 1px 7px; border-radius: 4px; }
  .pkg-plus { color: var(--plus); background: var(--plus-light); }
  .pkg-premium { color: var(--premium); background: var(--premium-light); }
  .impact-line { font-size: 15.5px; font-weight: 500; color: var(--ink); text-align: center; margin: 0 0 16px; }
  .video-box { text-align: center; }
  .video-caption { font-size: 11.5px; color: var(--ink-muted); margin: 8px 0 0; line-height: 1.5; text-align: left; }
  .video-caption.match-weak { color: var(--warn); }
  .video-caption b { color: var(--ink); }
  .closed-stamp { min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .stamp-icon { width: 56px; height: 56px; color: var(--accent); }
  .closed-caveat { font-family: 'Caveat', cursive; font-weight: 600; font-size: 26px; color: var(--ink); transform: rotate(-1deg); margin: 0; }
  .controls { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .navbtn {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: var(--ink-soft);
    background: transparent; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  .navbtn:hover { border-color: var(--ink-muted); }
  .navbtn:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rule); border: none; padding: 0; }
  .dot.active { background: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <p class="intro">Five pros. Each one's whole arc, start to finish, before you move to the next.</p>
  <div class="pro-tabs" id="proTabs"></div>
  <div class="book"><div class="page" id="page"></div></div>
  <div class="controls">
    <button class="navbtn" id="prevBtn">&larr; Back</button>
    <div class="dots" id="dots"></div>
    <button class="navbtn" id="nextBtn">Next &rarr;</button>
  </div>
</div>
<script>
  var PROS = [{"name": "Maria Santos", "trade": "House cleaner", "loc": "Phoenix, AZ", "doodle": "<svg id=\"Layer_2\" data-name=\"Layer 2\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 221 236.79\">\n  <defs>\n    <style>\n      .cls-1 {\n        stroke-width: 2.01px;\n      }\n\n      .cls-1, .cls-2, .cls-3, .cls-4 {\n        fill: none;\n        stroke: currentColor;\n        stroke-linecap: round;\n        stroke-linejoin: round;\n      }\n\n      .cls-2 {\n        stroke-width: 1.28px;\n      }\n\n      .cls-3 {\n        stroke-width: 1.64px;\n      }\n\n      .cls-4 {\n        stroke-width: 1.46px;\n      }\n    </style>\n  </defs>\n  <g id=\"Layer_1-2\" data-name=\"Layer 1\">\n    <g>\n      <path class=\"cls-1\" d=\"M22.92,64.1c-2.44-24.35,7.31-42.62,29.22-54.79C86.24-2.87,120.33-1.65,154.42,12.96c14.61,9.74,20.7,26.79,18.26,51.14\"/>\n      <path class=\"cls-1\" d=\"M26.57,60.45c4.87-14.61,15.83-26.79,32.88-36.53\"/>\n      <path class=\"cls-1\" d=\"M161.73,49.49c2.44,12.18,3.04,24.35,1.83,36.53\"/>\n      <path class=\"cls-1\" d=\"M37.53,67.75c-4.87,24.35-2.44,48.7,7.31,73.06,12.18,17.05,29.22,26.79,51.14,29.22,21.92-2.44,38.96-12.18,51.14-29.22,7.31-24.35,8.52-48.7,3.65-73.06\"/>\n      <path class=\"cls-3\" d=\"M59.45,96.97c4.87-2.44,10.96-2.44,18.26,0\"/>\n      <path class=\"cls-3\" d=\"M114.24,96.97c4.87-2.44,10.96-2.44,18.26,0\"/>\n      <ellipse cx=\"68.58\" cy=\"107.93\" rx=\"4.02\" ry=\"2.19\"/>\n      <ellipse cx=\"123.37\" cy=\"107.93\" rx=\"4.02\" ry=\"2.19\"/>\n      <path class=\"cls-4\" d=\"M95.98,115.24l-5.48,18.26c3.65,2.44,7.31,2.44,10.96,0\"/>\n      <path class=\"cls-3\" d=\"M81.37,148.11c9.74,3.65,19.48,3.65,29.22,0\"/>\n      <path class=\"cls-1\" d=\"M74.06,170.03v21.92\"/>\n      <path class=\"cls-1\" d=\"M117.89,170.03v21.92\"/>\n      <path class=\"cls-1\" d=\"M1,235.78c17.05-21.92,41.4-36.53,73.06-43.83h43.83c31.66,7.31,56.01,21.92,73.06,43.83\"/>\n      <g>\n        <rect class=\"cls-1\" x=\"190.95\" y=\"169.12\" width=\"25.57\" height=\"36.53\" rx=\"2.74\" ry=\"2.74\"/>\n        <rect class=\"cls-1\" x=\"198.26\" y=\"161.81\" width=\"10.96\" height=\"7.31\"/>\n        <path class=\"cls-3\" d=\"M209.22,165.46l10.96-9.13\"/>\n        <path class=\"cls-2\" d=\"M196.43,183.73h14.61\"/>\n      </g>\n    </g>\n  </g>\n</svg>", "pages": [{"label": "Business context", "html": "<div class=\"slots-grid\"><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">01</span>Current Business State</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;It's not seasonal \u2014 Mondays just feel emptier than they used to. New client flow has slowed and I can't really point to why.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">02</span>Growth Blocker</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;Word of mouth, basically all of it. I've never done anything to bring new clients in actively.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">03</span>Definition of Success</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;I'd love to add two or three new recurring clients a month. Not one-time jobs.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">04</span>Lead Gen History & Investment</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;Maybe two years ago. I tried one \u2014 three leads in the first couple weeks. None of them turned into anything.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">05</span>Decision Maker</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;It's just me. No partner, no employees. I make all the decisions for the business.&rdquo;</span></p></div></div>"}, {"label": "The story", "html": "<p class=\"story-p\">Discovery&rsquo;s done, no hesitation. The Package Routing Guide points to <span class=\"pkg pkg-plus\">Plus</span>, anchored to the two or three recurring clients a month she asked for.</p><p class=\"story-p quote\">&ldquo;Because you said you&rsquo;d love to add two or three new recurring clients a month, not one-time jobs&hellip;&rdquo; &mdash; Maria: &ldquo;Yeah, let&rsquo;s do it.&rdquo;</p>"}, {"label": "Key takeaways", "html": "<p class=\"story-step\"><b>Key takeaway</b></p><p class=\"story-p\">Not every call needs the full Diagnostic Cycle. When a recommendation lands the way Maria&rsquo;s did, the job is to confirm it and move to close &mdash; not manufacture a step that isn&rsquo;t there.</p><p class=\"story-p\">Discovery that&rsquo;s genuinely complete, and a recommendation anchored to exactly what she said, is sometimes all it takes.</p>"}, {"label": "Closed", "html": "<div class=\"closed-stamp\"><svg viewBox=\"0 0 60 60\" class=\"stamp-icon\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M18 31l8 8 16-18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><p class=\"closed-caveat\">Maria&rsquo;s story &mdash; closed.</p></div>"}]}, {"name": "Marcus Bell", "trade": "HVAC Technician", "loc": "Dallas, TX", "doodle": "<svg id=\"Layer_2\" data-name=\"Layer 2\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220.28 240.05\">\n  <defs>\n    <style>\n      .cls-1 {\n        stroke-width: 2.24px;\n      }\n\n      .cls-1, .cls-2, .cls-3, .cls-4, .cls-5, .cls-6 {\n        stroke: currentColor;\n        stroke-linecap: round;\n        stroke-linejoin: round;\n      }\n\n      .cls-1, .cls-2, .cls-4, .cls-5, .cls-6 {\n        fill: none;\n      }\n\n      .cls-2 {\n        stroke-width: 2.05px;\n      }\n\n      .cls-3, .cls-5 {\n        stroke-width: 1.68px;\n      }\n\n      .cls-4 {\n        stroke-width: .93px;\n      }\n\n      .cls-6 {\n        stroke-width: 1.31px;\n      }\n    </style>\n  </defs>\n  <g id=\"Layer_1-2\" data-name=\"Layer 1\">\n    <g>\n      <path class=\"cls-2\" d=\"M42.06,59.97c-4.97-27.36,1.24-46.01,18.65-55.96,14.92-4.97,28.6-3.73,41.03,3.73,12.43-7.46,26.11-8.7,41.03-3.73,17.41,9.95,23.63,28.6,18.65,55.96\"/>\n      <path class=\"cls-5\" d=\"M90.56,7.74c7.46,7.46,14.92,7.46,22.38,0\"/>\n      <path class=\"cls-6\" d=\"M56.98,26.39l7.46-11.19\"/>\n      <path class=\"cls-6\" d=\"M142.78,26.39l7.46-11.19\"/>\n      <path class=\"cls-2\" d=\"M45.79,63.7c-4.97,24.87-1.24,49.74,11.19,74.61,14.92,19.9,29.84,31.09,44.77,33.57,19.9-2.49,36.06-13.68,48.5-33.57,12.43-24.87,16.17-49.74,11.19-74.61\"/>\n      <path class=\"cls-2\" d=\"M62.58,93.54c7.46-3.73,14.92-3.73,22.38,0\"/>\n      <path class=\"cls-2\" d=\"M124.13,93.54c7.46-3.73,14.92-3.73,22.38,0\"/>\n      <ellipse cx=\"73.77\" cy=\"108.46\" rx=\"4.29\" ry=\"2.42\"/>\n      <ellipse cx=\"133.46\" cy=\"108.46\" rx=\"4.29\" ry=\"2.42\"/>\n      <path class=\"cls-5\" d=\"M101.75,115.92l-5.6,22.38c3.73,2.49,7.46,2.49,11.19,0\"/>\n      <path class=\"cls-3\" d=\"M75.63,142.04c9.95-2.49,19.27-3.73,27.98-3.73s18.03,1.24,27.98,3.73c-2.49,4.97-7.46,7.46-14.92,7.46h-26.11c-7.46,0-12.43-2.49-14.92-7.46Z\"/>\n      <path class=\"cls-5\" d=\"M90.56,156.96c8.7,2.49,17.41,2.49,26.11,0\"/>\n      <path class=\"cls-2\" d=\"M79.37,171.88v22.38\"/>\n      <path class=\"cls-2\" d=\"M127.86,171.88v22.38\"/>\n      <path class=\"cls-2\" d=\"M1.03,239.03c17.41-24.87,43.52-39.79,78.34-44.77h48.5c37.3,4.97,63.42,19.9,78.34,44.77\"/>\n      <path class=\"cls-5\" d=\"M83.1,194.26l18.65,14.92,22.38-14.92\"/>\n      <g>\n        <circle class=\"cls-2\" cx=\"200.6\" cy=\"194.26\" r=\"18.65\"/>\n        <circle class=\"cls-4\" cx=\"200.6\" cy=\"194.26\" r=\"13.06\"/>\n        <circle cx=\"200.6\" cy=\"194.26\" r=\"2.24\"/>\n        <line class=\"cls-1\" x1=\"200.6\" y1=\"194.26\" x2=\"209.93\" y2=\"183.07\"/>\n        <line class=\"cls-6\" x1=\"200.6\" y1=\"177.48\" x2=\"200.6\" y2=\"181.21\"/>\n        <line class=\"cls-6\" x1=\"217.39\" y1=\"194.26\" x2=\"213.66\" y2=\"194.26\"/>\n        <line class=\"cls-6\" x1=\"200.6\" y1=\"211.05\" x2=\"200.6\" y2=\"207.32\"/>\n        <line class=\"cls-6\" x1=\"183.82\" y1=\"194.26\" x2=\"187.55\" y2=\"194.26\"/>\n        <line class=\"cls-4\" x1=\"208.07\" y1=\"181.21\" x2=\"209\" y2=\"183.07\"/>\n        <line class=\"cls-4\" x1=\"212.73\" y1=\"188.67\" x2=\"210.86\" y2=\"188.67\"/>\n      </g>\n    </g>\n  </g>\n</svg>", "pages": [{"label": "Business context", "html": "<div class=\"slots-grid\"><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">01</span>Current Business State</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;Me and two techs. We're doing 35 to 40 service calls a week, $40K to $50K a month in revenue.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">02</span>Growth Blocker</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;Summer's killing us in a good way \u2014 we're turning away work. Winter slows to a crawl. Feast and famine.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">03</span>Definition of Success</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;Steady year-round revenue. Maintenance contracts on 200 homes would do it.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">04</span>Lead Gen History & Investment</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;Google Ads have been good \u2014 about $2K a month, gets us 8 to 10 jobs reliably.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">05</span>Decision Maker</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;My wife handles the books, so I'd talk it through with her. But the call is mine.&rdquo;</span></p></div></div>"}, {"label": "The story", "html": "<p class=\"story-p\">The &ldquo;talk to my wife&rdquo; line wasn&rsquo;t really about her &mdash; it was the length of the commitment.</p><p class=\"story-p\">Once he saw the 200-home contracts fix the feast-or-famine cycle he&rsquo;d already named, he was in.</p><p class=\"story-p quote\">&ldquo;Yeah&hellip; the longer stretch is what actually fixes it.&rdquo;</p><p class=\"story-p\"><span class=\"pkg pkg-premium\">Premium</span>. Closed.</p>"}, {"label": "Key takeaways", "html": "<p class=\"story-step\"><b>Key takeaway</b></p><p class=\"story-p\">A hesitation isn&rsquo;t always what it sounds like. Marcus&rsquo;s &ldquo;talk to my wife&rdquo; line wasn&rsquo;t about her &mdash; it was about the length of the commitment.</p><p class=\"story-p\">Reading past the surface objection to what&rsquo;s actually driving it is the job. Taking it at face value would have meant diagnosing the wrong thing entirely.</p>"}, {"label": "Closed", "html": "<div class=\"closed-stamp\"><svg viewBox=\"0 0 60 60\" class=\"stamp-icon\"><circle cx=\"30\" cy=\"30\" r=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M18 31l8 8 16-18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><p class=\"closed-caveat\">Marcus&rsquo;s story &mdash; closed.</p></div>"}]}, {"name": "Derek Washington", "trade": "Landscaper", "loc": "Atlanta, GA", "doodle": "<svg id=\"Layer_2\" data-name=\"Layer 2\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256.15 274.58\">\n  <defs>\n    <style>\n      .cls-1 {\n        stroke-width: 2.46px;\n      }\n\n      .cls-1, .cls-2, .cls-3, .cls-4, .cls-5, .cls-6, .cls-7 {\n        fill: none;\n        stroke: currentColor;\n        stroke-linecap: round;\n        stroke-linejoin: round;\n      }\n\n      .cls-2 {\n        stroke-width: 2.25px;\n      }\n\n      .cls-3 {\n        stroke-width: 2.05px;\n      }\n\n      .cls-4 {\n        stroke-width: 1.84px;\n      }\n\n      .cls-5 {\n        stroke-width: 1.23px;\n      }\n\n      .cls-6 {\n        stroke-width: 1.64px;\n      }\n\n      .cls-7 {\n        stroke-width: 1.43px;\n      }\n    </style>\n  </defs>\n  <g id= tory", "html": "<p class=\"story-step\"><b>Read the reaction</b> &rarr; <span class=\"quote-inline\">&ldquo;Whoa &mdash; that&rsquo;s a lot more than I was expecting to spend.&rdquo;</span></p><p class=\"story-step\"><b>Identify</b> &rarr; Definition of Success</p><p class=\"story-step\"><b>Respond</b> &rarr; <span class=\"quote-inline\">&ldquo;That&rsquo;s what gets you to 40 properties fastest &mdash; not a separate expense.&rdquo;</span></p><p class=\"story-step\"><b>Read again</b> &rarr; <span class=\"quote-inline\">&ldquo;Yeah&hellip; I guess that tracks.&rdquo;</span></p><p class=\"story-p\"><span class=\"pkg pkg-premium\">Premium</span>. Closed.</p>"}, {"label": "Real pro", "html": "<p class=\"story-p impact-line\">Derek almost walked away over the price. Now watch a real Thumbtack pro who felt exactly the same way \u2014 and what happened next.</p><div class=\"video-box\"><video controls preload=\"none\" poster=\"data:image/jpeg;base64,/9j//gARTGF2YzU4LjEzNC4xMDAA/9sAQwAIBgYHBgcICAgICAgJCQkKCgoJCQkJCgoKCgoKDAwMCgoKCgoKCgwMDAwNDg0NDQwNDg4PDw8SEhERFRUVGRkf/8QApgAAAQUBAQEAAAAAAAAAAAAAAwcFBAECBgAIAQEBAQEBAQEAAAAAAAAAAAABAAIDBAUGEAACAQMCAgcDBwgHCAMBAAACAQMABBEhBTESYSJRQROBBpFxMlKxc0KhwRR00XIzgmIHIxY04VOyRZOzwkMkNZI28FQl0vERAAIBAgUCBQMFAQAAAAAAAAABAhEDMSFBEgRRInGRgRNhsUIy0fGh4VJi/8AAEQgAcQDIAwEiAAIRAAMRAP/aAAwDAQACEQMRAD8A7UHUmMqbwkqTGdYNDrC6nwummE6nxSUgPEJYqUMmlNUcuKN41RE8paAUlRnNQ3LmoCSzrDOo/iV7xKCLl1pru4kSpxJ1FlWayRy17aZzpRttssJaU43MOc1ItIUKVREy1hQqnGPSo0axRkVKIlIq2iqLz1akpILeRK5tZ4n/AMSMx82tPtpP7KO5kkN+Euq+syLlxpnHS2vKu+UlcqeAuLiNLlxKSf7y4i+nqvT2V6uLelbU4qlHn+xw5SjtUnWtVFLTN6kob4Xyjok8Ljw//leOV5xww6aZnNDOvCXiRMuqGMos9xrvfT7KeoYo40jIEi4tEXMg6E32dtcOdzFat23bapcTptar4UxR6eNK0nJ3U5tfitPUqHmSba0fDpdbcreVQp7wCLq5LHZw/trkN+3e6ureULdlCK4ofjMeDTa4e5VWbc52IylBrLc1LFeZ6YOF66pdsXJpPL0Hy59S7dYTICm8QuZCSi63Jl8SLPKsd+ua1/Sza/71/Z+ekwkiUOfxEnhv+7Fc8nmKeB/aa91C8Sz+Xcf6Yf8A7rL47u9yjJ/KTO848FOkrkm1i0m1/CoKABcKlRFUAHwqTGVB84coiqbFJTXGdSQkqIdQloni03DLW1LSRO8Ss89RkdaRUASEVbTqOJUQSo ;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">02</span>Growth Blocker</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;November through February it slows way down \u2014 we're 90% homeowners and people don't paint in January.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">03</span>Definition of Success</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;Two or three commercial accounts that keep us booked December through February.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">04</span>Lead Gen History & Investment</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;I had a bad experience with another platform a few years back \u2014 mostly tire-kickers.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">05</span>Decision Maker</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;It's me. My husband's an accountant \u2014 he sees the books but doesn't call the business shots.&rdquo;</span></p></div></div>"}, {"label": "The story", "html": "<p class=\"story-p\"><i>She&rsquo;d been burned by a platform before &mdash; picking up exactly where the previous course left this.</i></p><p class=\"story-p\">Reminded that this only asks for the three winter months she actually needs, not a repeat of that experience.</p><p class=\"story-p quote\">&ldquo;Okay&hellip; if it&rsquo;s really just those three months, let&rsquo;s do it.&rdquo;</p><p class=\"story-p\"><span class=\"pkg pkg-plus\">Plus</span>. Closed.</p>"}, {"label": "Real pro", "html": "<p class=\"story-p impact-line\">Rosa had been burned by a platform before. Here's a real Thumbtack pro who felt that same hesitation \u2014 and how it played out for them.</p><div class=\"video-box\"><video controls preload=\"none\" poster=\"data:image/jpeg;base64,/9j//gARTGF2YzU4LjEzNC4xMDAA/9sAQwAIBgYHBgcICAgICAgJCQkKCgoJCQkJCgoKCgoKDAwMCgoKCgoK Definition of Success</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;Two to three full-renovation projects a year \u2014 aiming for around $2M in revenue within 18 months.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">04</span>Lead Gen History & Investment</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;Houzz has been my best source \u2014 I paid $300 a month for two years, got about half my business that way.&rdquo;</span></p></div><div class=\"slot\"><p class=\"slot-label\"><span class=\"slot-num\">05</span>Decision Maker</p><p class=\"slot-evidence\"><span class=\"hl\">&ldquo;It's me. I bounce things off my project manager, but the call is mine. I sign the contracts.&rdquo;</span></p></div></div>"}, {"label": "The story", "html": "<p class=\"story-p\">Two hesitations, both worked through. When nothing new came up, that&rsquo;s the <b>Conversion Signal</b> &mdash; not more diagnosis, but converting.</p><p class=\"story-p\"><b>Committed return call:</b> Thursday, 2pm. Premium paperwork ready. AE owns the follow-up.</p><p class=\"story-p\">Thursday comes. No new concerns.</p><p class=\"story-p quote\">&ldquo;Let&rsquo;s do it.&rdquo;</p><p class=\"story-p\"><span class=\"pkg pkg-premium\">Premium</span>. Closed.</p>"}, {"label": "Real pro", "html": "<p class=\"story-p impact-line\">Jen's first instinct was &ldquo;I&rsquo;m too busy right now.&rdquo; Watch a real Thumbtack pro who said the same thing \u2014 and what happened after.</p><div class=\"video-box\"><video controls preload=\"none\" poster=\"data:image/jpeg;base64,/9j//gARTGF2YzU4LjEzNC4xMDAA/9sAQwAIBgYHBgcICAgICAgJCQkKCgoJCQkJCgoKCgoKDAwMCgoKCgoKCgwMDAwNDg0NDQwNDg4PDw8SEhERFRUVGRkf/8QAoAABAAIDAQEBAAAAAAAAAAAAAAUGBwQDAggBAQEAAwEBAAAAAAAAAAAAAAAABAEDAgUQAAEDAgQDBQQIBQQDAQAAAAEAAgMEERIhMQVBEwZRImFxB3IUkTKCoYGxQiM1M8PBFbNSc9SyU0Ph8HQRAAICAQIEBQEFCQEAAAAAAAABAhEDEjEEITJBYRMigVFxcjRC4RSx0cFSkYIFI/Ch/8AAEQgAcQDIAwEiAAIRAAMRAP/aAAwDAQACEQMRAD8Aw2iIgCIiA   var proIdx = 0, pageIdx = 0;
  var showingConclusion = false;
  var pageEl = document.getElementById('page');
  var bookEl = document.querySelector('.book');
  var dotsEl = document.getElementById('dots');
  var tabsEl = document.getElementById('proTabs');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');

  function renderTabs() {
    tabsEl.innerHTML = '';
    PROS.forEach(function(p, i) {
      var b = document.createElement('button');
      b.className = 'pro-tab' + (i === proIdx && !showingConclusion ? ' active' : '');
      b.textContent = p.name.split(' ')[0];
      b.onclick = function() { goTo(i, 0); };
      tabsEl.appendChild(b);
    });
  }

  function renderDots() {
    dotsEl.innerHTML = '';
    PROS[proIdx].pages.forEach(function(pg, i) {
      var d = document.createElement('button');
      d.className = 'dot' + (i === pageIdx && !showingConclusion ? ' active' : '');
      d.onclick = function() { goTo(proIdx, i); };
      dotsEl.appendChild(d);
    });
  }

  function showConclusion() {
    showingConclusion = true;
    var overlay = document.createElement('div');
    overlay.className = 'conclusion-overlay';
    overlay.innerHTML =
      '<div class="conclusion-card">' +
        '<svg viewBox="0 0 60 60" class="conclusion-icon"><circle cx="30" cy="30" r="26" fill="none" stroke="currentColor" stroke-width="3"/><path d="M18 31l8 8 16-18" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<p class="conclusion-headline">All five, closed.</p>' +
        '<p class="conclusion-body">Discovery, the story, and a real Thumbtack pro&rsquo;s proof &mdash; five times over.</p>' +
        '<div class="conclusion-callout">' +
          '<span class="conclusion-callout-arrow">&#8600;</span>' +
          '<span class="conclusion-callout-text">Click <b>Continue</b> in the bottom-right corner of your screen to move on to the Package Routing Guide.</span>' +
        '</div>' +
        '<button class="conclusion-back" id="conclusionBackBtn">&larr; Look back at a Pro&rsquo;s story</button>' +
      '</div>';
    bookEl.appendChild(overlay);
    document.getElementById('conclusionBackBtn').onclick = function() {
      showingConclusion = false;
      overlay.remove();
      renderTabs();
      renderDots();
      updateNav();
    };
    tabsEl.querySelectorAll('.pro-tab').forEach(function(b) { b.classList.remove('active'); });
    dotsEl.querySelectorAll('.dot').forEach(function(d) { d.classList.remove('active'); });
    updateNav();
  }

  function updateNav() {
    var isVeryFirst = proIdx === 0 && pageIdx === 0 && !showingConclusion;
    prevBtn.disabled = isVeryFirst;
    prevBtn.style.visibility = showingConclusion ? 'hidden' : 'visible';
    nextBtn.style.visibility = showingConclusion ? 'hidden' : 'visible';
  }

  function renderPage() {
    var p = PROS[proIdx];
    var pg = p.pages[pageIdx];
    pageEl.innerHTML =
      '<div class="page-eyebrow"><span class="page-eyebrow-label">' + pg.label + '</span>' +
        '<span class="page-eyebrow-count">Pro ' + (proIdx + 1) + ' of ' + PROS.length + ' &middot; Page ' + (pageIdx + 1) + ' of ' + p.pages.length + '</span></div>' +
      (pageIdx < 3 ? (
      '<div class="pro-header">' +
        '<div class="doodle-box">' + p.doodle + '</div>' +
        '<div class="pro-header-text"><p class="pro-name">' + p.name + '</p>' +
          '<p class="pro-trade">' + p.trade + ' &middot; ' + p.loc + '</p></div>' +
        (pageIdx === 0 ? '<div class="ready-badge">5/5 &middot; ready</div>' : '') +
      '</div>') : '') + pg.html;
    var isVeryLast = proIdx === PROS.length - 1 && pageIdx === p.pages.length - 1;
    nextBtn.textContent = isVeryLast ? 'Continue →' : 'Next →';
    updateNav();
    renderTabs();
    renderDots();
  }

  function stepIndex(pIdx, gIdx, delta) {
    var flat = [];
    PROS.forEach(function(p, i) { p.pages.forEach(function(_, j) { flat.push([i, j]); }); });
    var cur = flat.findIndex(function(x) { return x[0] === pIdx && x[1] === gIdx; });
    var next = (cur + delta + flat.length) % flat.length;
    return flat[next];
  }

  function flipTo(newProIdx, newPageIdx) {
    pageEl.style.transition = 'transform .3s cubic-bezier(.4,0,.7,1), opacity .3s';
    pageEl.style.transform = 'rotateY(-95deg)';
    pageEl.style.opacity = '0.4';
    setTimeout(function() {
      proIdx = newProIdx; pageIdx = newPageIdx;
      renderPage();
      pageEl.style.transition = 'none';
      pageEl.style.transform = 'rotateY(95deg)';
      requestAnimationFrame(function() {
        pageEl.style.transition = 'transform .3s cubic-bezier(.3,0,.2,1), opacity .3s';
        pageEl.style.transform = 'rotateY(0deg)';
        pageEl.style.opacity = '1';
      });
    }, 300);
  }

  function goTo(pIdx, gIdx) { if (pIdx !== proIdx || gIdx !== pageIdx) flipTo(pIdx, gIdx); }
  prevBtn.onclick = function() { var t = stepIndex(proIdx, pageIdx, -1); flipTo(t[0], t[1]); };
  nextBtn.onclick = function() {
    var isVeryLast = proIdx === PROS.length - 1 && pageIdx === PROS[proIdx].pages.length - 1;
    if (isVeryLast) { showConclusion(); return; }
    var t = stepIndex(proIdx, pageIdx, 1); flipTo(t[0], t[1]);
  };

  renderPage();
</script>
